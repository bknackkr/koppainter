# ==============================================================================
# Köppainter Color-to-Biome Definition File
# ==============================================================================
# This file maps RGB colors (in hex format) from climate map images (such as
# exported World Climate Lab maps) to Minecraft biomes.
#
# Format:
#   <HEX_COLOR> = <BIOME>
#
# <HEX_COLOR> syntax:
#   - 6-digit hex RRGGBB:   FF0000, 00FF00, #0000FF, 0xFF00FF
#   - 8-digit hex AARRGGBB: FFFF0000, #FF00FF00
#   - Leading '#' and '0x'/'0X' prefixes are optional and ignored.
#   - Hex letters are case-insensitive ('ff0000' equals 'FF0000').
#
# <BIOME> syntax:
#   - Namespaced modern ID:  minecraft:desert, minecraft:dark_forest
#   - Short name:            desert, plains, cherry_grove, pale_garden
#   - Display name:          Desert, Snowy Plains, Old Growth Pine Taiga
#   - Numerical biome ID:    2, 1, 12, 245
#   - Custom / Modded biome: modid:custom_biome
#
# Blank lines and lines starting with '#', '!', or '//' are treated as comments.
# Inline comments following '#' on a line are also supported.
# ==============================================================================

# ==============================================================================
# Default Köppen-Geiger Climate Classification Mappings
# ==============================================================================

# Group A: Tropical Climates
# Af  - Tropical rainforest
0000FF = minecraft:jungle
# Am  - Tropical monsoon (note: FF0000 mapped above)
0077FF = minecraft:sparse_jungle
# Aw  - Tropical savanna
46A9FA = minecraft:savanna

# Group B: Arid Climates
# BWh - Hot desert
FF0000 = minecraft:desert
# BWk - Cold desert
FF9695 = minecraft:badlands
# BSh - Hot semi-arid
F5A301 = minecraft:savanna
# BSk - Cold semi-arid
FFDB63 = minecraft:plains

# Group C: Temperate / Mesothermal Climates
# Csa - Mediterranean hot summer
FFFF00 = minecraft:meadow
# Csb - Mediterranean warm summer
C6C700 = minecraft:forest
# Csc - Mediterranean cool summer
969600 = minecraft:meadow
# Cwa - Humid subtropical dry winter
96FF96 = minecraft:forest
# Cwb - Subtropical highland
63C764 = minecraft:windswept_forest
# Cwc - Cold subtropical highland
329633 = minecraft:windswept_hills
# Cfa - Humid subtropical
C6FF4E = minecraft:flower_forest
# Cfb - Oceanic / Temperate oceanic
66FF33 = minecraft:plains
# Cfc - Subpolar oceanic
33C701 = minecraft:taiga

# Group D: Continental / Microthermal Climates
# Dsa - Mediterranean continental hot summer
FF00FF = minecraft:forest
# Dsb - Mediterranean continental warm summer
C600C7 = minecraft:taiga
# Dsc - Subarctic dry summer
963295 = minecraft:snowy_taiga
# Dsd - Extremely cold subarctic dry summer
966495 = minecraft:snowy_plains
# Dwa - Monsoon continental hot summer
ABB1FF = minecraft:forest
# Dwb - Monsoon continental warm summer
5A77DB = minecraft:taiga
# Dwc - Subarctic dry winter
4C51B5 = minecraft:snowy_taiga
# Dwd - Extremely cold subarctic dry winter
320087 = minecraft:snowy_plains
# Dfa - Humid continental hot summer
00FFFF = minecraft:forest
# Dfb - Humid continental warm summer
38C7FF = minecraft:dark_forest
# Dfc - Subarctic (boreal taiga)
007E7D = minecraft:taiga
# Dfd - Extremely cold subarctic
00455E = minecraft:snowy_taiga

# Group E: Polar Climates
# ET  - Tundra
B2B2B2 = minecraft:snowy_plains
